<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="俄语闪卡">
  <meta name="theme-color" content="#0F0F1A">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">
  <title>俄语闪卡 Русский</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      height: 100%; 
      background-color: #0F0F1A;
      overflow: hidden;
    }
    #loading {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #0F0F1A;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: -apple-system, sans-serif;
      z-index: 9999;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(92,133,214,0.3);
      border-top-color: #5C85D6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p style="color:#8A8AA0;font-size:14px">加载中...</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var loading = document.getElementById('loading');
      if (loading) loading.style.display = 'none';
    });
  </script>
  <script src="flutter.js" defer></script>
  <script defer>
    document.addEventListener("DOMContentLoaded", function() {
      if (typeof _flutter !== 'undefined') {
        _flutter.loader.loadEntrypoint({
          onEntrypointLoaded: async function(engineInitializer) {
            var appRunner = await engineInitializer.initializeEngine({
              renderer: 'html'
            });
            await appRunner.runApp();
          }
        });
      } else {
        // 降级方案：直接加载 main.dart.js
        var script = document.createElement('script');
        script.src = 'main.dart.js';
        document.body.appendChild(script);
      }
    });
  </script>
</body>
</html>
