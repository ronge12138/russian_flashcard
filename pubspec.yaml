name: russian_flashcard
description: Russian vocabulary flashcard app with spaced repetition.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  path_provider: ^2.1.3
  flutter_tts: ^3.6.3
  dio: ^5.4.3+1
  shared_preferences: ^2.3.2 
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  isar_generator: ^3.1.0
  build_runner: ^2.4.9
  analyzer: ^5.13.0 

flutter:
  uses-material-design: true
