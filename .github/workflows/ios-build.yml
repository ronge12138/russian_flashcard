name: iOS Build Unsigned

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Print environment info
        run: |
          flutter --version
          xcodebuild -version

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate Isar code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Patch project for unsigned build
        run: |
          PROJECT="ios/Runner.xcodeproj/project.pbxproj"

          # 注入假 Team ID 骗过 Flutter 的 Team 检查
          sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = "FAKETEAMID1";/g' "$PROJECT"
          sed -i '' 's/DEVELOPMENT_TEAM = ;/DEVELOPMENT_TEAM = "FAKETEAMID1";/g' "$PROJECT"

          # 如果没有 DEVELOPMENT_TEAM 字段则追加（针对部分项目结构）
          if ! grep -q "DEVELOPMENT_TEAM" "$PROJECT"; then
            sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER/DEVELOPMENT_TEAM = "FAKETEAMID1";\n\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER/g' "$PROJECT"
          fi

          # 禁用签名验证
          sed -i '' 's/CODE_SIGN_IDENTITY = ".*";/CODE_SIGN_IDENTITY = "-";/g' "$PROJECT"
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = ".*";/PROVISIONING_PROFILE_SPECIFIER = "";/g' "$PROJECT"

          echo "=== 验证 patch 结果 ==="
          grep -n "DEVELOPMENT_TEAM\|CODE_SIGN" "$PROJECT" | head -20

      - name: Build iOS no codesign
        run: |
          flutter build ios \
            --release \
            --no-codesign
        env:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGN_IDENTITY: "-"

      - name: Locate Runner.app
        run: |
          echo "=== 搜索 Runner.app ==="
          find build -name "Runner.app" -type d 2>/dev/null || true

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build -name "Runner.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "找不到 Runner.app"
            find build -type d | head -30
            exit 1
          fi
          echo "找到：$APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/Runner.app
          zip -r russian_flashcard_unsigned.ipa Payload
          ls -lh russian_flashcard_unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: russian-flashcard-unsigned-ipa
          path: russian_flashcard_unsigned.ipa
          retention-days: 30
          if-no-files-found: error
