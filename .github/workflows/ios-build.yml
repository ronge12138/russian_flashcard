name: iOS Build Unsigned

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate Isar code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Patch pbxproj
        run: |
          PROJECT="ios/Runner.xcodeproj/project.pbxproj"
          sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = "FAKETEAMID1";/g' "$PROJECT"
          sed -i '' 's/DEVELOPMENT_TEAM = ;/DEVELOPMENT_TEAM = "FAKETEAMID1";/g' "$PROJECT"
          grep -q "DEVELOPMENT_TEAM" "$PROJECT" || sed -i '' \
            's/PRODUCT_BUNDLE_IDENTIFIER/DEVELOPMENT_TEAM = "FAKETEAMID1";\n\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER/g' \
            "$PROJECT"

      - name: Build iOS no codesign
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --no-tree-shake-icons
        env:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGN_IDENTITY: ""

      - name: Ad-hoc sign all frameworks and binary
        run: |
          APP_PATH=$(find build -name "Runner.app" -type d | head -1)
          echo "=== App 路径: $APP_PATH ==="

          # 签名所有 .framework
          find "$APP_PATH/Frameworks" -name "*.framework" -type d 2>/dev/null | \
          while read fw; do
            echo "签名 framework: $fw"
            codesign --force --sign - --preserve-metadata=entitlements "$fw"
          done

          # 签名所有 .dylib
          find "$APP_PATH" -name "*.dylib" 2>/dev/null | \
          while read lib; do
            echo "签名 dylib: $lib"
            codesign --force --sign - "$lib"
          done

          # 签名主 App bundle
          echo "签名主 App..."
          codesign --force --sign - \
            --entitlements ios/Runner/Runner.entitlements \
            "$APP_PATH" 2>/dev/null || \
          codesign --force --sign - "$APP_PATH"

          # 验证签名
          echo "=== 验证签名 ==="
          codesign -dv "$APP_PATH" 2>&1 || true

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build -name "Runner.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            find build -name "*.app" -type d
            exit 1
          fi
          echo "打包: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/Runner.app
          zip -r russian_flashcard_unsigned.ipa Payload
          ls -lh russian_flashcard_unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: russian-flashcard-unsigned-ipa
          path: russian_flashcard_unsigned.ipa
          retention-days: 30
          if-no-files-found: error
