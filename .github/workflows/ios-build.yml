name: iOS Build Unsigned

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Print environment info
        run: |
          flutter --version
          xcodebuild -version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate Isar code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Disable code signing
        run: |
          PROJECT="ios/Runner.xcodeproj/project.pbxproj"
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = "";/g' "$PROJECT"
          sed -i '' 's/CODE_SIGN_IDENTITY = ".*";/CODE_SIGN_IDENTITY = "";/g' "$PROJECT"
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = ".*";/PROVISIONING_PROFILE_SPECIFIER = "";/g' "$PROJECT"
          echo "Code signing disabled"

      - name: Build iOS no codesign
        run: flutter build ios --release --no-codesign

      - name: Locate Runner.app
        run: find build -name "Runner.app" -type d 2>/dev/null || true

      - name: Package unsigned IPA
        run: |
          APP_PATH=""
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            APP_PATH="build/ios/iphoneos/Runner.app"
          elif [ -d "build/ios/Release-iphoneos/Runner.app" ]; then
            APP_PATH="build/ios/Release-iphoneos/Runner.app"
          else
            find build -name "*.app" -type d
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/Runner.app
          zip -r russian_flashcard_unsigned.ipa Payload
          ls -lh russian_flashcard_unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: russian-flashcard-unsigned-ipa
          path: russian_flashcard_unsigned.ipa
          retention-days: 30
          if-no-files-found: error
