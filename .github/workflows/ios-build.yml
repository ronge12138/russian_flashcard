name: iOS Build Unsigned

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Print environment info
        run: |
          flutter --version
          xcodebuild -version

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate Isar code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Patch pbxproj
        run: |
          PROJECT="ios/Runner.xcodeproj/project.pbxproj"
          sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = "FAKETEAMID1";/g' "$PROJECT"
          sed -i '' 's/DEVELOPMENT_TEAM = ;/DEVELOPMENT_TEAM = "FAKETEAMID1";/g' "$PROJECT"
          grep -q "DEVELOPMENT_TEAM" "$PROJECT" || sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER/DEVELOPMENT_TEAM = "FAKETEAMID1";\n\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER/g' "$PROJECT"
          echo "pbxproj patched"

      - name: Build iOS no codesign
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --no-tree-shake-icons \
            --dart-define=FLUTTER_WEB_CANVASKIT_URL=canvaskit/
        env:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGN_IDENTITY: ""

      - name: Verify App bundle contents
        run: |
          APP_PATH=$(find build -name "Runner.app" -type d | head -1)
          echo "=== App bundle 内容 ==="
          ls -la "$APP_PATH"
          echo "=== Frameworks ==="
          ls -la "$APP_PATH/Frameworks" 2>/dev/null || echo "无 Frameworks 目录"
          echo "=== flutter_assets ==="
          ls "$APP_PATH/flutter_assets" 2>/dev/null || echo "无 flutter_assets"

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build -name "Runner.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "找不到 Runner.app"
            exit 1
          fi
          echo "找到：$APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/Runner.app
          zip -r russian_flashcard_unsigned.ipa Payload
          ls -lh russian_flashcard_unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: russian-flashcard-unsigned-ipa
          path: russian_flashcard_unsigned.ipa
          retention-days: 30
          if-no-files-found: error
